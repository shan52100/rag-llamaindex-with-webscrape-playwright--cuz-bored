services:
  # ── Python backend ────────────────────────────────────────────────────────
  - type: web
    name: rag-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false          # fill in Render dashboard after deploy
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # ── Next.js frontend (static site) ───────────────────────────────────────
  - type: web
    name: rag-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: out
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        sync: false          # set to https://rag-backend.onrender.com after backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
